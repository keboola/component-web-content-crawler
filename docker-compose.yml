services:
  # for development purposes
  dev:
    build: .
    volumes:
      - ./src:/code/src
      - ./data:/data
    environment:
      - KBC_DATADIR=/data
    shm_size: '2gb'
    mem_limit: 2g
  test:
    build: .
    volumes:
      - ./src:/code/src
      - ./data:/data
    environment:
      - KBC_DATADIR=/data
    command:
      - /bin/sh
      - build_n_test.sh
  bash:
    build: .
    volumes:
      - ./src:/code/src
      - ./data:/data
    environment:
      - KBC_DATADIR=/data

    command:
      - /bin/sh
      - build_n_test.sh